<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Alat Radiologi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#dde2ea;--ac:#0b6e99;--ok:#1f8a4c;--wr:#b86e00;--er:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2c3542;--ac:#4cb3e0;--ok:#4cc27f;--wr:#e0a63a;--er:#ef6f60}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2c3542;--ac:#4cb3e0;--ok:#4cc27f;--wr:#e0a63a;--er:#ef6f60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:24px 0 10px}
main{max-width:980px;margin:0 auto;padding:16px 20px 40px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{margin-top:8px}.f input,.f select{flex:1;min-width:140px}
input,select,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button.p,.f button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}
.b{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.b.er{color:var(--er);border-color:var(--er)}.b.wr{color:var(--wr);border-color:var(--wr)}.b.ok{color:var(--ok);border-color:var(--ok)}.b.ac{color:var(--ac);border-color:var(--ac)}
.er{color:var(--er)}.wr{color:var(--wr)}
.mu{color:var(--mu)}p{margin:6px 0}.lg{font-size:13px;color:var(--mu);border-left:2px solid var(--bd);padding-left:8px;margin:2px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500;font-size:13px}
#mode{font-size:12px;color:var(--mu)}th[colspan]{text-align:center}.ft{display:inline-block;position:relative;margin:4px 6px 4px 0}.ft img{height:90px;border-radius:6px;border:1px solid var(--bd);display:block}.ft button{position:absolute;top:2px;right:2px;padding:0 6px}.w{width:100%;max-width:560px}.sub{display:block;margin:4px 0 0 24px}.rep td.c{text-align:center}.eb{font-size:12px;padding:2px 8px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}.dlg{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:440px;width:100%}.dlg p{margin:0 0 14px}.dlg .row{justify-content:flex-end}.dc{background:var(--ac);border-color:var(--ac);color:#fff;cursor:pointer}.dc.dng{background:var(--er);border-color:var(--er)}.dn{cursor:pointer}.ft button{font-size:11px}.ta{flex:1 1 100%;width:100%;min-height:64px;resize:vertical;overflow:hidden;font:inherit;line-height:1.45;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}.rep td,.tw td,.lg{white-space:pre-wrap}.f input[type=checkbox]{flex:none;min-width:0}.ft.pdf button{position:static;padding:0 6px}.card.rep{background:#fff;color:#000;font-family:'Times New Roman',Times,serif}.rep table{border:1px solid #000}.rep th,.rep td{border:1px solid #000;color:#000;vertical-align:top;font-size:14px}.rep th{text-align:center;vertical-align:middle}.rep th.noprint,.rep td.noprint{border:none}@media print{.card.rep{border:none;padding:0}header,.noprint,#mode{display:none!important}body{background:#fff;color:#000}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head><body>
<header><h1>🩻 Maintenance Alat Radiologi</h1><nav id="nav"></nav></header>
<main><div id="mode"></div><div id="v"></div></main>
<script>
const FLOW=['Baru','Diverifikasi','Dalam Perbaikan','Menunggu Sparepart','Uji Fungsi','Selesai'];
let db=null,S={alat:[],tiket:[],lap:[],nm:[]},tab='dash',L={a:'',b:new Date().toISOString().slice(0,7)};
const $=s=>document.querySelector(s);
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function ask(msg,ok,single){ok=ok||'Hapus';return new Promise(r=>{const o=document.createElement('div');o.className='ov';
 o.innerHTML='<div class="dlg"><p></p><div class="row"><button class="dn">Batal</button><button class="dc'+(ok==='Hapus'?' dng':'')+'"></button></div></div>';
 o.querySelector('p').textContent=msg;o.querySelector('.dc').textContent=ok;if(single)o.querySelector('.dn').remove();
 document.body.appendChild(o);const done=v=>{o.remove();r(v)};
 o.querySelector('.dc').onclick=()=>done(true);const n=o.querySelector('.dn');if(n)n.onclick=()=>done(false);
 o.onclick=e=>{if(e.target===o)done(!!single)}})}
window.alert=m=>{ask(String(m),'OK',true)};const today=()=>new Date().toLocaleDateString('en-CA');const ld=s=>!s?'':s.length===10?s:new Date(s).toLocaleDateString('en-CA');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=a=>a.kal?Math.ceil((new Date(a.kal)-new Date())/864e5):null;
function lsLoad(){try{return JSON.parse(localStorage.getItem('rad')||'')}catch(e){return null}}
function lsSave(){try{localStorage.setItem('rad',JSON.stringify(S))}catch(e){}}
function fail(e){alert(e&&e.code==='invalid_argument'?'Anda tidak punya izin mengubah data.':'Gagal menyimpan: '+((e&&e.message)||e))}
async function add(c,o){if(db){try{await db.collection(c).add(o)}catch(e){fail(e)}}else{o.id='l'+Date.now()+Math.random().toString(36).slice(2,5);S[c].push(o);lsSave();render()}}
async function upd(c,id,o){if(db){try{await db.collection(c).doc(id).update(o)}catch(e){fail(e)}}else{const x=S[c].find(y=>y.id===id);if(x)Object.assign(x,o);lsSave();render()}}
function sub(c){db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>Object.assign({},typeof d.data==='function'?d.data():d.data,{id:d.id}));render()},()=>{})}
function go(t){tab=t;render()}
const stat=(l,n,c)=>`<div class="card st"><b class="${c||''}">${n}</b><span>${l}</span></div>`;
async function addA(){const nama=$('#a_n').value.trim();if(!nama)return alert('Nama alat wajib diisi.');
 await add('alat',{nama,tipe:$('#a_t').value.trim(),serial:$('#a_s').value.trim(),ruang:$('#a_r').value.trim(),kalT:$('#a_c').value,ukes:$('#a_u').value,paparan:$('#a_p').value,status:'Layak pakai'});go('alat')}
function dash(){const A=S.alat,act=S.tiket.filter(t=>t.status!=='Selesai'),rusak=A.filter(a=>a.status==='Rusak').length,
 due=jadwal(A);
 return `<div class="g">${stat('Total alat',A.length)}${stat('Alat rusak',rusak,rusak?'er':'')}${stat('Kasus kerusakan aktif',act.length,act.length?'wr':'')}${stat('Jadwal segera jatuh tempo',due.length,due.length?'wr':'')}</div>
 <h2>Kasus kerusakan aktif</h2>${act.length?act.map(t=>{const z=lastJ(t);return `<div class="card"><div class="row"><b>${esc(t.alatNama)}</b><span class="b ac">${esc(t.status)}</span></div><p>${esc(z.j||'')}</p><p class="mu">${fmt(ld(rt(z)))}</p><button onclick="K='${ld(rt(z)).slice(0,7)}';go('kru')">Buka di Laporan Kerusakan Medis</button></div>`}).join(''):'<p class="mu">Tidak ada kasus kerusakan aktif.</p>'}
 <h2>Jadwal kalibrasi / uji kesesuaian</h2>${due.length?due.map(x=>`<div class="card"><b>${esc(x.a.nama)}</b> <span class="mu">${esc(x.a.ruang)}</span><br>${x.j}: ${x.l<0?'<span class="er">Lewat '+(-x.l)+' hari</span>':x.l+' hari lagi'} (jatuh tempo ${fmt(x.t)})</div>`).join(''):'<p class="mu">Belum ada jadwal yang mendekati jatuh tempo.</p>'}`}
function alat(){const A=S.alat;
 return `${aform()}
 <h2>Daftar alat</h2>${A.length?`<div class="card tw"><table><tr><th>Alat</th><th>Tipe / No. seri</th><th>Ruangan</th><th>Kalibrasi terakhir</th><th>Uji kesesuaian terakhir</th><th>Uji paparan terakhir</th><th>Status</th><th>Riwayat</th><th></th></tr>${A.map(a=>`<tr><td><b>${esc(a.nama)}</b></td><td>${esc(a.tipe)} ${esc(a.serial)}</td><td>${esc(a.ruang)}</td><td>${cel(a.kalT,plus(a.kalT,1),30)}</td><td>${cel(a.ukes,plus(a.ukes,4),180)}</td><td>${fmt(a.paparan)||'-'}</td><td><span class="b ${a.status==='Rusak'?'er':'ok'}">${esc(a.status)}</span></td><td>${S.tiket.filter(t=>t.alatId===a.id).length} kasus</td><td><button class="eb" onclick="editA('${a.id}')">Edit</button> <button class="eb" onclick="delA('${a.id}')">Hapus</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Belum ada alat. Tambahkan alat pertama di atas.</p>'}`}
const fmt=s=>s?s.split('-').reverse().join('/'):'';
const lapKey=()=>L.a+'-'+L.b;
const getLap=()=>S.lap.find(x=>x.id===lapKey())||{cek:{},rows:[]};
async function putLap(d){const key=lapKey();d.alatId=L.a;d.bulan=L.b;
 if(db){try{await db.collection('lap').doc(key).set(d)}catch(e){fail(e)}}
 else{const i=S.lap.findIndex(x=>x.id===key);d.id=key;if(i<0)S.lap.push(d);else S.lap[i]=d;lsSave();render()}}
function cek(k,v){const d=getLap();putLap({cek:Object.assign({},d.cek,{[k]:v}),rows:d.rows||[]})}
let RE=-1;
async function addR(){const g=i=>$('#r_'+i).value.trim();if(!g('k')&&!g('ket'))return alert('Isi kegiatan atau keterangan.');
 const d=getLap(),nr={tgl:$('#r_t').value,keg:g('k'),tl:g('l'),ket:g('ket')},R=d.rows||[],i=RE;RE=-1;
 await putLap({cek:d.cek||{},rows:i>=0&&R[i]?R.map((x,j)=>j===i?nr:x):R.concat([nr])})}
function editRB(i){RE=i;render();const f=document.getElementById('lapform');if(f)f.scrollIntoView({behavior:'smooth'})}
async function delR(i){if(!await ask('Hapus baris kegiatan ini dari laporan bulanan?'))return;const d=getLap();RE=-1;await putLap({cek:d.cek||{},rows:(d.rows||[]).filter((_,j)=>j!==i)})}
function lap(){const A=S.alat;if(!A.length)return '<h2>Laporan Bulanan</h2><p class="mu">Tambahkan alat dulu di menu Alat.</p>';
 if(!A.find(a=>a.id===L.a))L.a=A[0].id;
 const a=A.find(x=>x.id===L.a),d=getLap(),c=d.cek||{},R=d.rows||[],F=c.fotos||[],ed=RE>=0&&R[RE]?R[RE]:null;
 const bl=new Date(L.b+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'}).toUpperCase();
 const ck=(k,l)=>`<label><input type="checkbox" ${c[k]?'checked':''} onchange="cek('${k}',this.checked)"> ${l}</label>`;
 const tx=(k,ph)=>`<textarea id="c_${k}" class="ta w" rows="2" oninput="grow(this)" placeholder="${ph}" onchange="cek('${k}',this.value.trim())">${esc(c[k])}</textarea>`;
 const dt=k=>`<input id="c_${k}" type="date" value="${esc(c[k])}" onchange="cek('${k}',this.value)">`;
 return `<h2>Laporan Bulanan</h2><div class="card row noprint"><select onchange="L.a=this.value;RE=-1;this.blur();render()">${A.map(x=>`<option value="${esc(x.id)}" ${x.id===L.a?'selected':''}>${esc(x.nama)}${x.ruang?' — '+esc(x.ruang):''}</option>`).join('')}</select><input type="month" value="${L.b}" onchange="if(this.value){L.b=this.value;RE=-1;this.blur();render()}"></div>
<div class="card"><b>${esc(a.nama)} — ${bl}</b><p class="mu">Centang jika sudah dilakukan</p>
<p>${ck('backup','Back up data bulanan')}<span class="sub">Backup dari tanggal ${dt('backupDari')} sampai tanggal ${dt('backupSampai')}</span></p>
<p>${ck('bersih','Pembersihan alat bulanan')}<span class="sub">${F.map(id=>`<span class="ft">${imgTag(id,'Foto pembersihan')}<button class="noprint" onclick="delF('${id}')">Hapus</button></span>`).join('')}${(AS||db)?`<label class="noprint">Foto pembersihan: <input type="file" accept="image/*" multiple onchange="upF(this)"></label>`:'<span class="mu noprint">Upload foto tidak tersedia karena aplikasi belum terhubung ke penyimpanan online. Buka lewat tautan di claude.ai dengan akun yang sudah masuk.</span>'}</span></p>
<p>${ck('laporan','Pengisian laporan alat bulanan')}</p>
<p>${ck('suhu','Pengisian suhu dan kelembapan ruangan')}<span class="sub">${tx('suhuKet','Kendala jika suhu / kelembapan ruangan tidak sesuai (kosongkan bila tidak ada)')}</span></p>
<p>${ck('kartu','Pengisian kartu pemeliharaan alat')}<span class="sub">${tx('kartuKet','Kendala yang ditulis di kartu pemeliharaan alat (kosongkan bila tidak ada)')}</span></p>
<p>${ck('validasi','Validasi ka inst')}</p></div>
<div class="card tw"><table><tr><th>No</th><th>Tanggal</th><th>Kegiatan</th><th>Tindak lanjut</th><th>Keterangan</th><th class="noprint"></th></tr>${R.map((r,i)=>`<tr><td>${i+1}</td><td>${fmt(r.tgl)}</td><td>${esc(r.keg)}</td><td>${esc(r.tl)}</td><td>${esc(r.ket)}</td><td class="noprint"><button class="eb" onclick="editRB(${i})">Edit</button> <button class="eb" onclick="delR(${i})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">Belum ada kegiatan bulan ini.</td></tr>'}</table></div>
<div class="noprint" style="margin:10px 0"><button class="p" onclick="pdfLapBln()">Cetak (unduh PDF)</button></div>
<div class="card noprint" id="lapform"><b>${ed?'Edit baris kegiatan':'Tambah baris'}</b><div class="row f"><input id="r_t" type="date" value="${ed?esc(ed.tgl):today()}"><textarea id="r_k" class="ta" rows="2" oninput="grow(this)" placeholder="Kegiatan">${ed?esc(ed.keg):''}</textarea><textarea id="r_l" class="ta" rows="2" oninput="grow(this)" placeholder="Tindak lanjut">${ed?esc(ed.tl):''}</textarea><textarea id="r_ket" class="ta" rows="2" oninput="grow(this)" placeholder="Keterangan">${ed?esc(ed.ket):''}</textarea>${ed?`<button onclick="addR()">Simpan perubahan</button><button onclick="RE=-1;render()" style="background:none;color:var(--tx)">Batal</button>`:`<button onclick="addR()">Tambah</button>`}</div></div>`}
let NE='';
const KAT=['AC','Bangunan dan Interior','Listrik','Air dan Sanitasi','Furnitur'];
function nmform(){const e=S.nm.find(x=>x.id===NE)||{},v=k=>esc(e[k]||'');
 return `<div class="card noprint"><b>${e.id?'Edit data kerusakan non medis':'Tambah data kerusakan non medis'}</b><div class="row f"><label class="mu">Tanggal lapor <input id="n_t" type="date" value="${e.id?v('tgl'):today()}"></label><input id="n_l" placeholder="Lokasi / peralatan (mis. Ruang CT Scan (AC Standing))" value="${v('lokasi')}"><input id="n_k" list="katl" placeholder="Kategori (mis. AC)" value="${v('kat')}"><datalist id="katl">${KAT.map(k=>`<option value="${k}">`).join('')}</datalist><textarea id="n_u" class="ta" rows="2" oninput="grow(this)" placeholder="Uraian kerusakan">${v('uraian')}</textarea><textarea id="n_i" class="ta" rows="2" oninput="grow(this)" placeholder="Tindak lanjut IPSRS">${v('tl')}</textarea><label class="mu">Tanggal selesai <input id="n_s" type="date" value="${v('selesai')}"></label><select id="n_st"><option ${e.status!=='Selesai'?'selected':''}>Tindak lanjut</option><option ${e.status==='Selesai'?'selected':''}>Selesai</option></select>${e.id?`<button onclick="saveN()">Simpan perubahan</button><button onclick="NE='';render()" style="background:none;color:var(--tx)">Batal</button>`:`<button onclick="addN()">Tambah</button>`}</div></div>`}
function nmVal(){const g=i=>$('#n_'+i).value.trim();if(!g('l')||!g('u')){alert('Isi lokasi/peralatan dan uraian kerusakan.');return null}
 return {tgl:$('#n_t').value||today(),lokasi:g('l'),kat:g('k'),uraian:g('u'),tl:g('i'),selesai:$('#n_s').value,status:$('#n_st').value}}
async function addN(){const o=nmVal();if(!o)return;K=o.tgl.slice(0,7);await add('nm',Object.assign(o,{fk:false,spk:false,bukti:[]}))}
async function saveN(){const o=nmVal();if(!o)return;const id=NE;NE='';await upd('nm',id,o)}
function editN(id){NE=id;render();scrollTo({top:0,behavior:'smooth'})}
async function delN(id){if(!await ask('Hapus data kerusakan ini beserta bukti yang diunggah?'))return;
 const n=S.nm.find(x=>x.id===id);
 if(db){try{await db.collection('nm').doc(id).delete()}catch(e){return fail(e)}}else{S.nm=S.nm.filter(x=>x.id!==id);lsSave();render()}
 if(n)for(const b of (n.bukti||[]))await rmFile(b.id);}
const flagN=(c,id,k,v)=>upd(c,id,{[k]:v});
async function upB(c,id,j,el){const fs=[...el.files];if(!fs.length||(!AS&&!db))return;el.disabled=true;
 try{const add2=[];
  for(const f of fs){const img=f.type.startsWith('image/');
   if(AS){const r=await AS.upload(img?await shrink(f):f,(!f.type&&/\.pdf$/i.test(f.name))?{type:'application/pdf'}:undefined);add2.push({id:r.id,j,name:f.name,ct:r.contentType})}
   else{if(!img)throw new Error('File PDF hanya bisa diunggah dari akun yang punya akses penyimpanan file. Foto tetap bisa.');const fid=await putFoto(f);if(!fid)throw new Error('Foto tidak bisa diproses atau terlalu besar.');add2.push({id:fid,j,name:f.name,ct:'image/jpeg'})}}
  const cur=S[c].find(x=>x.id===id);if(!cur)return;
  await upd(c,id,{bukti:(cur.bukti||[]).concat(add2),[j==='form'?'fk':'spk']:true})}
 catch(e){alert('Gagal mengunggah: '+((e&&e.message)||e))}
 finally{el.disabled=false;el.value=''}}
async function delB(c,id,bid){if(!await ask('Hapus bukti ini?'))return;const n=S[c].find(x=>x.id===id);if(!n)return;
 await upd(c,id,{bukti:(n.bukti||[]).filter(b=>b.id!==bid)});await rmFile(bid)}
